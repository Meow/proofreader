[package]
name = "proofreader"
version = "0.1.0"
edition = "2024"
description = "A RuboCop-like linter and autocorrector for GLua (Garry's Mod Lua)"
license = "MIT"

[[bin]]
name = "proofreader"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
automod = "1.0.17"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"
inventory = "0.3.24"
owo-colors = "4.4.0"
rayon = "1.12.0"
similar = "3.2.0"
thiserror = "2.0.21"
walkdir = "2.5.0"
yaml-rust2 = "0.13.0"
