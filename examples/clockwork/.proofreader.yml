# Clockwork style.
#
# - tab indentation, a tab 4 columns wide, lines of at most 120 characters
# - PascalCase function and method names (local functions too), lowerCamelCase variables
# - {a, b, c} without spaces inside braces
# - every statement ending a line ends with `;`, including the `end` of blocks and functions
#   (`end;`, `end);`); lines ending in `then`, `do`, `else` or a function header take none
# - net messages through Clockwork.datastream:Hook as well as net.Receive
# - SQL through the bundled MySQL wrapper: queries run with `:RawQuery`, values escaped with
#   `:Escape`
# - everything else as in the Flux style (see ../flux/.proofreader.yml), except that doc comments
#   need not document every parameter and return value

Layout/IndentationStyle:
  EnforcedStyle: tabs
  IndentationWidth: 4                      # how wide a tab is

Layout/IndentationWidth:
  Width: 4

Layout/IndentationConsistency:
  IndentationWidth: 4

Layout/LineLength:
  Max: 120
  IndentationWidth: 4

Layout/SpaceInsideBraces:
  EnforcedStyle: no_space                  # {a, b, c}

Naming/MethodName:
  EnforcedStyle: PascalCase

Naming/VariableName:
  EnforcedStyle: camelCase

Style/Semicolon:
  EnforcedStyle: require

Security/NetMessageExecution:
  PayloadReceivers: ['Clockwork.datastream:Hook', 'netstream.Hook', 'cable.receive',
                     'Cable.receive']

Security/SqlInjection:
  Methods: ['query', 'RawQuery']           # Clockwork.database:RawQuery
  EscapeMethods: ['Escape', 'escape', 'quote', 'quote_name']

Naming/FieldName:
  Enabled: false                           # field names follow no single convention here
