# Every proofreader setting with its built-in default. Copy this file to the root of a GLua
# project as .proofreader.yml and change what you need; settings left at their default can
# be deleted. Every reader also accepts `Include` and `Exclude` (glob lists, empty by
# default). `proofreader --show-readers <Reader>` prints the effective settings of a reader.

# inherit_from: ../.proofreader.yml       # a string or a list, relative to this file

AllReaders:
  Include: ['**/*.lua', '**/*.lumen']
  Exclude: []
  # Severity: convention                  # overrides the default severity of every reader

# Checks for a UTF-8 byte order mark at the start of the file.
Layout/ByteOrderMark:
  Enabled: true
  Severity: convention
  AutoCorrect: true

# Checks for an empty line after the end of a multi-line block.
Layout/EmptyLineAfterBlock:
  Enabled: true
  Severity: convention
  AutoCorrect: true

# Checks for an empty line after a guard clause.
Layout/EmptyLineAfterGuardClause:
  Enabled: true
  Severity: convention
  AutoCorrect: true

# Checks for an empty line before multi-line block statements.
Layout/EmptyLineBeforeBlock:
  Enabled: true
  Severity: convention
  AutoCorrect: true
  IncludeAnonymousFunctions: false

# Checks for empty lines between function definitions.
Layout/EmptyLineBetweenDefs:
  Enabled: true
  Severity: convention
  AutoCorrect: true
  NumberOfEmptyLines: 1
  AllowAdjacentOneLineDefs: true

# Checks for two or more consecutive blank lines.
Layout/EmptyLines:
  Enabled: true
  Severity: convention
  AutoCorrect: true

# Checks for blank lines at the beginning and end of block bodies.
Layout/EmptyLinesAroundBlockBody:
  Enabled: true
  Severity: convention
  AutoCorrect: true

# Checks for consistent LF (or CRLF) line endings.
Layout/EndOfLine:
  Enabled: true
  Severity: convention
  AutoCorrect: true
  EnforcedStyle: lf

# Checks for extra spaces between tokens.
Layout/ExtraSpacing:
  Enabled: true
  Severity: convention
  AutoCorrect: true
  AllowForAlignment: true
  ForceEqualSignAlignment: false

# Checks that the statements of a block are indented consistently.
Layout/IndentationConsistency:
  Enabled: true
  Severity: convention
  AutoCorrect: true
  AllowIndentedGroups: true
  IndentationWidth: 2

# Checks that indentation uses spaces, not tabs.
Layout/IndentationStyle:
  Enabled: true
  Severity: convention
  AutoCorrect: true
  EnforcedStyle: spaces
  IndentationWidth: 2

# Checks that block bodies are indented by the configured width and closers align with their openers.
Layout/IndentationWidth:
  Enabled: true
  Severity: convention
  AutoCorrect: true
  Width: 2

# Checks for a space after the comment marker.
Layout/LeadingCommentSpace:
  Enabled: true
  Severity: convention
  AutoCorrect: true

# Checks that lines are not longer than the configured maximum.
Layout/LineLength:
  Enabled: true
  Severity: convention
  AutoCorrect: true
  Max: 120
  AllowURI: true
  IgnoreComments: false
  IndentationWidth: 2

# Checks for a missing space after a comma.
Layout/SpaceAfterComma:
  Enabled: true
  Severity: convention
  AutoCorrect: true

# Checks for space between `!` and its operand.
Layout/SpaceAfterNot:
  Enabled: true
  Severity: convention
  AutoCorrect: true

# Checks that operators have a single space around them, and that `..` has none.
Layout/SpaceAroundOperators:
  Enabled: true
  Severity: convention
  AutoCorrect: true
  ConcatStyle: no_space
  AllowForAlignment: true

# Checks for spaces before a comma.
Layout/SpaceBeforeComma:
  Enabled: true
  Severity: convention
  AutoCorrect: true

# Checks for a space between code and a trailing comment.
Layout/SpaceBeforeComment:
  Enabled: true
  Severity: convention
  AutoCorrect: true

# Checks for spaces between a function name and its opening parenthesis.
Layout/SpaceBeforeParen:
  Enabled: true
  Severity: convention
  AutoCorrect: true

# Checks the spacing inside table constructor braces.
Layout/SpaceInsideBraces:
  Enabled: true
  Severity: convention
  AutoCorrect: true
  EnforcedStyle: space

# Checks for spaces inside square brackets.
Layout/SpaceInsideBrackets:
  Enabled: true
  Severity: convention
  AutoCorrect: true
  EnforcedStyle: no_space

# Checks for spaces inside parentheses.
Layout/SpaceInsideParens:
  Enabled: true
  Severity: convention
  AutoCorrect: true
  EnforcedStyle: no_space

# Checks that the file ends with exactly one newline.
Layout/TrailingEmptyLines:
  Enabled: true
  Severity: convention
  AutoCorrect: true

# Checks for trailing whitespace.
Layout/TrailingWhitespace:
  Enabled: true
  Severity: convention
  AutoCorrect: true

# Checks for network strings, receivers, console commands and variables registered twice.
Lint/DuplicateRegistration:
  Enabled: true
  Severity: warning
  AutoCorrect: true

# Checks for modules that are required more than once.
Lint/DuplicateRequire:
  Enabled: true
  Severity: warning
  AutoCorrect: true
  Functions: ['require']

# Checks for duplicate literal keys in table constructors.
Lint/DuplicateTableKey:
  Enabled: true
  Severity: warning
  AutoCorrect: true

# Checks for assert messages that are built even when the assertion passes.
Lint/NonLiteralAssertMessage:
  Enabled: false
  Severity: warning
  AutoCorrect: true

# Checks for labels defined twice in the same block.
Lint/RedefinedLabel:
  Enabled: true
  Severity: error
  AutoCorrect: true
  AllowNestedRedefinition: true

# Checks for locals that shadow a local of the same name.
Lint/RedefinedLocal:
  Enabled: true
  Severity: warning
  AutoCorrect: true
  AllowParameters: false

# Checks for variables and parameters named after a GMod library.
Lint/ShadowedLibrary:
  Enabled: true
  Severity: warning
  AutoCorrect: true
  Libraries: ['player', 'team', 'file', 'table', 'sound', 'string', 'math', 'util', 'net', 'hook',
              'timer', 'render', 'surface', 'draw', 'ents', 'game', 'engine', 'input', 'gui',
              'vgui', 'http', 'os', 'debug', 'bit']

# Checks for unterminated literals, stray characters, unbalanced blocks and code that does not parse.
Lint/Syntax:
  Enabled: true
  Severity: fatal
  AutoCorrect: true

# Checks for assignments with more targets than values or more values than targets.
Lint/UnbalancedAssignment:
  Enabled: true
  Severity: warning
  AutoCorrect: true

# Checks for `@param` tags that name no parameter of the documented function.
Lint/UndefinedDocParam:
  Enabled: true
  Severity: warning
  AutoCorrect: true
  TypedParamTags: ['string', 'number', 'int', 'bool', 'tab', 'func', 'thread']

# Checks for documentation tags that are not in `KnownTags`.
Lint/UnknownDocTag:
  Enabled: false
  Severity: warning
  AutoCorrect: true
  KnownTags: ['accessorfunc', 'alias', 'as', 'async', 'author', 'bool', 'cast', 'category', 'class',
              'classmod', 'copyright', 'deprecated', 'deprecation', 'deprecation_version',
              'diagnostic', 'enum', 'environment', 'export', 'field', 'file', 'fixme', 'func',
              'function', 'generic', 'hook', 'ignore', 'int', 'internal', 'lfunction', 'license',
              'local', 'meta', 'module', 'nodiscard', 'number', 'operator', 'overload', 'package',
              'param', 'private', 'protected', 'public', 'raise', 'realm', 'release', 'return',
              'script', 'section', 'see', 'source', 'string', 'submodule', 'tab', 'table', 'thread',
              'todo', 'topic', 'tparam', 'treturn', 'type', 'usage', 'vararg', 'variant', 'version',
              'warning', 'within']

# Checks for statements that can never run.
Lint/UnreachableCode:
  Enabled: true
  Severity: warning
  AutoCorrect: true
  TerminatingFunctions: ['error']

# Checks for methods that never use their implicit `self`.
Lint/UnusedSelf:
  Enabled: false
  Severity: warning
  AutoCorrect: true

# Checks for variables that are declared but never read.
Lint/UnusedVariable:
  Enabled: true
  Severity: warning
  AutoCorrect: true
  AllowUnusedParameters: false

# Checks that class and module names use PascalCase.
Naming/ClassName:
  Enabled: true
  Severity: convention
  AutoCorrect: true
  Functions: ['class', 'mod', 'extends']

# Checks that the table fields the code defines follow the configured naming style.
Naming/FieldName:
  Enabled: true
  Severity: convention
  AutoCorrect: true
  EnforcedStyle: snake_case
  AllowedNames: ['m_*', 'col[A-Z]*', 'tex[A-Z]*', 'onSuccess', 'onError', 'onAborted', 'onData',
                 'onConnected', 'onConnectionFailed']

# Checks that defined functions and methods follow the configured naming style.
Naming/MethodName:
  Enabled: true
  Severity: convention
  AutoCorrect: true
  EnforcedStyle: snake_case
  LocalFunctionStyle: same

# Checks that variables and parameters follow the configured naming style.
Naming/VariableName:
  Enabled: true
  Severity: convention
  AutoCorrect: true
  EnforcedStyle: snake_case

# Checks for objects built from constants in functions that run every frame or tick.
Performance/ConstantObjectInHotPath:
  Enabled: true
  Severity: warning
  AutoCorrect: true
  HotPaths: ['CalcAbsolutePosition', 'CalcMainActivity', 'CalcVehicleView', 'CalcView',
             'CalcViewModelView', 'CreateMove', 'Draw', 'DrawDeathNotice', 'DrawHUD',
             'DrawMonitors', 'DrawOverlay', 'DrawPhysgunBeam', 'DrawTranslucent',
             'DrawWeaponSelection', 'DrawWorldModel', 'DrawWorldModelTranslucent', 'FinishMove',
             'GetMotionBlurValues', 'HUDAmmoPickedUp', 'HUDDrawPickupHistory', 'HUDDrawScoreBoard',
             'HUDDrawTargetID', 'HUDItemPickedUp', 'HUDPaint', 'HUDPaintBackground',
             'HUDShouldDraw', 'HUDWeaponPickedUp', 'Move', 'NeedsDepthPass', 'Paint', 'PaintOver',
             'PhysicsSimulate', 'PhysicsUpdate', 'PlayerDeathThink', 'PlayerPostThink',
             'PlayerTick', 'PostDraw2DSkyBox', 'PostDrawEffects', 'PostDrawHUD',
             'PostDrawOpaqueRenderables', 'PostDrawPlayerHands', 'PostDrawSkyBox',
             'PostDrawTranslucentRenderables', 'PostDrawViewModel', 'PostPlayerDraw', 'PostRender',
             'PreDrawEffects', 'PreDrawHalos', 'PreDrawHUD', 'PreDrawOpaqueRenderables',
             'PreDrawPlayerHands', 'PreDrawSkyBox', 'PreDrawTranslucentRenderables',
             'PreDrawViewModel', 'PreDrawViewModels', 'PrePlayerDraw', 'PreRender', 'RenderScene',
             'RenderScreenspaceEffects', 'SetupMove', 'SetupSkyboxFog', 'SetupWorldFog',
             'ShouldDrawLocalPlayer', 'StartCommand', 'Think', 'Tick', 'UpdateAnimation',
             'VehicleMove', 'ViewModelDrawn']
  HookFunctions: ['hook.Add']
  Functions: ['Color', 'Vector', 'Angle']

# Checks for expensive calls in functions that run every frame or tick.
Performance/ExpensiveCallInHotPath:
  Enabled: true
  Severity: warning
  AutoCorrect: true
  HotPaths: ['CalcAbsolutePosition', 'CalcMainActivity', 'CalcVehicleView', 'CalcView',
             'CalcViewModelView', 'CreateMove', 'Draw', 'DrawDeathNotice', 'DrawHUD',
             'DrawMonitors', 'DrawOverlay', 'DrawPhysgunBeam', 'DrawTranslucent',
             'DrawWeaponSelection', 'DrawWorldModel', 'DrawWorldModelTranslucent', 'FinishMove',
             'GetMotionBlurValues', 'HUDAmmoPickedUp', 'HUDDrawPickupHistory', 'HUDDrawScoreBoard',
             'HUDDrawTargetID', 'HUDItemPickedUp', 'HUDPaint', 'HUDPaintBackground',
             'HUDShouldDraw', 'HUDWeaponPickedUp', 'Move', 'NeedsDepthPass', 'Paint', 'PaintOver',
             'PhysicsSimulate', 'PhysicsUpdate', 'PlayerDeathThink', 'PlayerPostThink',
             'PlayerTick', 'PostDraw2DSkyBox', 'PostDrawEffects', 'PostDrawHUD',
             'PostDrawOpaqueRenderables', 'PostDrawPlayerHands', 'PostDrawSkyBox',
             'PostDrawTranslucentRenderables', 'PostDrawViewModel', 'PostPlayerDraw', 'PostRender',
             'PreDrawEffects', 'PreDrawHalos', 'PreDrawHUD', 'PreDrawOpaqueRenderables',
             'PreDrawPlayerHands', 'PreDrawSkyBox', 'PreDrawTranslucentRenderables',
             'PreDrawViewModel', 'PreDrawViewModels', 'PrePlayerDraw', 'PreRender', 'RenderScene',
             'RenderScreenspaceEffects', 'SetupMove', 'SetupSkyboxFog', 'SetupWorldFog',
             'ShouldDrawLocalPlayer', 'StartCommand', 'Think', 'Tick', 'UpdateAnimation',
             'VehicleMove', 'ViewModelDrawn']
  HookFunctions: ['hook.Add']
  UnsafeFunctions: ['player.GetAll', 'ents.GetAll', 'file.Append', 'file.CreateDir', 'file.Delete',
                    'file.Exists', 'file.Find', 'file.IsDir', 'file.Open', 'file.Read',
                    'file.Rename', 'file.Size', 'file.Time', 'file.Write', 'CompileString',
                    'RunString', 'RunStringEx', 'table.HasValue', 'surface.CreateFont',
                    'surface.GetTextureID', 'Material', 'vgui.Create']
  ExtraUnsafeFunctions: []
  SafeFunctions: []
  Alternatives: {}

# Checks that logical operators are spelled `and`/`or` (or `&&`/`||`).
Style/AndOr:
  Enabled: true
  Severity: convention
  AutoCorrect: true
  EnforcedStyle: keywords

# Checks the parentheses of calls with a single string or table argument.
Style/CallParentheses:
  Enabled: false
  Severity: convention
  AutoCorrect: true
  EnforcedStyle: always

# Checks that comments use the configured comment markers.
Style/CommentStyle:
  Enabled: true
  Severity: convention
  AutoCorrect: true
  EnforcedStyle: lua

# Checks that function definitions are preceded by a doc comment.
Style/DocumentationMethod:
  Enabled: true
  Severity: convention
  AutoCorrect: true
  RequireForLocalFunctions: false

# Checks that documented functions document every parameter and their return value.
Style/IncompleteDocumentation:
  Enabled: false
  Severity: convention
  AutoCorrect: true
  TypedParamTags: ['string', 'number', 'int', 'bool', 'tab', 'func', 'thread']

# Checks that the inequality operator is spelled `!=` (or `~=`).
Style/InequalityOperator:
  Enabled: true
  Severity: convention
  AutoCorrect: true
  EnforcedStyle: bang

# Checks for `if` statements that can be inverted into a guard clause to reduce nesting.
Style/InvertIf:
  Enabled: false
  Severity: convention
  AutoCorrect: true
  MinBodyLength: 3

# Checks that logical negation is spelled `!` (or `not`).
Style/Not:
  Enabled: true
  Severity: convention
  AutoCorrect: true
  EnforcedStyle: bang

# Checks for (or requires) parentheses around the condition of `if`, `elseif`, `while` and `until`.
Style/ParenthesesAroundCondition:
  Enabled: true
  Severity: convention
  AutoCorrect: true
  EnforcedStyle: omit

# Checks for paths used where a local alias of them is in scope.
Style/PreferredLocalAlias:
  Enabled: true
  Severity: convention
  AutoCorrect: true

# Checks for semicolons, or with `EnforcedStyle: require` for statements without one.
Style/Semicolon:
  Enabled: true
  Severity: convention
  AutoCorrect: true
  EnforcedStyle: omit

# Checks that string literals use the configured quotes.
Style/StringLiterals:
  Enabled: true
  Severity: convention
  AutoCorrect: true
  EnforcedStyle: single_quotes

# Checks for a trailing comma after the last item of a table.
Style/TrailingCommaInTable:
  Enabled: true
  Severity: convention
  AutoCorrect: true
  EnforcedStyle: no_comma
