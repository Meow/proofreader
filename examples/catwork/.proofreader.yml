# Catwork style: the Flux style with Clockwork's naming.
#
# - everything as in the Flux style (2 spaces, 'single quotes', `!`, `!=`, `and`/`or`, blank lines
#   around blocks, ...), see ../flux/.proofreader.yml
# - lowerCamelCase locals and parameters, PascalCase functions and methods (cw.player:GetName())
# - no doc comment required on every function
# - the theme being built lives in the global `cwTHEME`
# - SQL through the bundled MySQL wrapper: queries run with `:RawQuery`, values escaped with
#   `:Escape`
# - plain Lua for stock Garry's Mod: none of the syntax extensions of LuaJIT 3.0 (`x += 1`,
#   `c ? a : b`, `|a| -> a`, ...), which the fix turns into plain Lua where it can

AllReaders:
  Exclude:
    - '**/thirdparty/**/*'                 # vendored libraries

Naming/VariableName:
  EnforcedStyle: camelCase

Naming/MethodName:
  EnforcedStyle: PascalCase

Style/DocumentationMethod:
  Enabled: false

Lint/ShadowedLibrary:
  # `player`, `team`, `file` and `sound` are fine as variable names: Clockwork keeps the
  # libraries reachable as `_player`, `_team`, `_file` and `_sound`.
  Libraries: ['table', 'string', 'math', 'util', 'net', 'hook', 'timer', 'render', 'surface',
              'draw', 'ents', 'game', 'engine', 'input', 'gui', 'vgui', 'http', 'os', 'debug',
              'bit']

Lint/GlobalAssignment:
  # `cwTHEME` holds the theme being built by cw.theme functions.
  AllowedGlobals: ['cwTHEME', 'GM', 'GAMEMODE', 'ENT', 'SWEP', 'EFFECT', 'TOOL', 'PANEL', 'PLUGIN',
                   'SCHEMA', 'Schema', 'ITEM', 'FACTION', 'CLASS', 'ATTRIBUTE', 'LANGUAGE',
                   'CHAT_CLASS', 'PACKAGE', 'CMD', 'ROLE', 'THEME', 'SKILL', 'PLAYER']

Security/SqlInjection:
  Methods: ['query', 'RawQuery']           # cw.database:RawQuery
  EscapeMethods: ['Escape', 'escape', 'quote', 'quote_name']

Naming/FieldName:
  Enabled: false                           # field names follow no single convention here

Lint/ExtendedSyntax:
  Enabled: true                            # the LuaJIT of stock Garry's Mod rejects them
